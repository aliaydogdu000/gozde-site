<!doctype html>
<html lang="tr" data-base=".">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gözde ÖZTÜRK AYDOĞDU · @gozdeoztuuurk</title>
  <meta name="description" content="Tarif ve içerik üreticisi, moleküler biyolog. Media kit, mekan haritası ve iş birliği.">
  <meta property="og:title" content="Gözde ÖZTÜRK AYDOĞDU · @gozdeoztuuurk">
  <meta property="og:description" content="Tarif & İçerik Üreticisi · Moleküler Biyolog · Ankara">
  <meta property="og:image" content="assets/avatar.jpg">
  <meta name="theme-color" content="#fdf6f1">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌻</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Carlito:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <main class="links-wrap">
    <header class="profile">
      <div class="avatar" id="avatar"><span></span></div>
      <h1 id="name">Gözde ÖZTÜRK AYDOĞDU</h1>
      <p class="handle" id="handle">@gozdeoztuuurk</p>
      <p class="tagline" id="tagline"></p>
      <p class="subline" id="subline"></p>
      <a class="mail-btn" id="mail" aria-label="E-posta gönder" title="E-posta gönder">💌</a>
    </header>
    <nav class="link-list" id="links" aria-label="Bağlantılar"></nav>
    <footer class="foot">🌻 <span id="year"></span> · <span id="foot-handle"></span></footer>
  </main>

  <script src="assets/common.js"></script>
  <script>
    (async () => {
      const { icons, esc } = Site;
      const site = await Site.json('site.json');

      Site.avatar(document.getElementById('avatar'), site);
      document.getElementById('name').textContent = site.name;
      document.getElementById('handle').textContent = '@' + site.handle;
      document.getElementById('tagline').textContent = site.tagline;
      document.getElementById('subline').textContent = site.subline;
      document.getElementById('year').textContent = new Date().getFullYear();
      document.getElementById('foot-handle').textContent = '@' + site.handle;
      document.getElementById('mail').href = `mailto:${site.email}`;

      const btn = ({ href, cls = '', chip, icon, title, sub, external }) => `
        <a class="link-btn ${cls}" href="${esc(href)}"${external ? ' target="_blank" rel="noopener"' : ''}>
          <span class="chip ${chip}">${icon}</span>
          <span class="txt"><span class="ttl">${esc(title)}</span>${sub ? `<span class="sub">${esc(sub)}</span>` : ''}</span>
          <span class="arr">${icons.arrow}</span>
        </a>`;

      // Order requested by Gözde: stats, map, socials, then the collab form last.
      const items = [
        { href: 'media-kit/', chip: 'sun', icon: icons.chart, title: 'Media Kit · İstatistikler' },
        { href: 'harita/', chip: 'leaf', icon: icons.pin, title: 'Mekan Haritası · Yerel Rehber Önerilerim' },
        ...site.socials.map((s) => ({
          href: s.url, external: true, chip: Site.platformChip[s.type] || 'plain',
          icon: icons[s.type] || icons.link, title: s.label,
        })),
        { href: 'is-birligi/', cls: 'primary', chip: '', icon: icons.spark, title: 'İş birliği için yaz' },
      ];
      document.getElementById('links').innerHTML = items.map(btn).join('');
    })();
  </script>
</body>
</html>
